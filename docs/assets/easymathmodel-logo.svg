<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="EasyMathModel">
  <title>EasyMathModel logo</title>

  <defs>
    <linearGradient id="emmMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- subtle background accents -->
  <circle cx="628" cy="34" r="96" fill="#EEF2FF"/>
  <circle cx="650" cy="186" r="68" fill="#FAF5FF"/>
  <circle cx="60" cy="196" r="34" fill="#F5F3FF"/>

  <!-- rounded-square mark with sigma + spark -->
  <rect x="24" y="62" width="100" height="100" rx="30" fill="url(#emmMark)"/>
  <path d="M46 84 h56 M102 84 66 112 l36 28 H46"
        fill="none" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="78" r="9" fill="#FBBF24"/>

  <!-- wordmark -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="156" y="112" font-size="50" font-weight="800" fill="#0F172A">
      <tspan fill="#4F46E5">Easy</tspan><tspan>Math</tspan><tspan fill="#A855F7">Model</tspan>
    </text>
    <text x="158" y="152" font-size="16" fill="#64748B" letter-spacing="3">
      MECHANICAL CHECKS · HUMAN JUDGMENT
    </text>
  </g>
</svg>
